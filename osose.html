<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Primary School Math Quiz</title>
  <style>
    :root {
      --bg: #0b1437;
      --card: #11204b;
      --card-alt: #1d2c6c;
      --accent: #f48c06;
      --accent-2: #64b5f6;
      --text: #eef2ff;
      --muted: #cbd5e1;
      --shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, rgba(100, 181, 246, 0.18), transparent 25%),
                  radial-gradient(circle at bottom right, rgba(244, 140, 6, 0.2), transparent 20%),
                  linear-gradient(180deg, #0d1742 0%, #091229 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding-bottom: 1.5rem;
    }

    header h1 {
      font-size: clamp(2.4rem, 4vw, 3.5rem);
      letter-spacing: -0.05em;
      margin-bottom: 0.75rem;
    }

    header p {
      color: var(--muted);
      font-size: 1rem;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.75;
    }

    .quiz-card {
      background: rgba(17, 32, 75, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 2rem;
      margin-top: 2rem;
      backdrop-filter: blur(12px);
    }

    .question {
      margin-bottom: 1.75rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .question:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .question h2 {
      font-size: 1.15rem;
      margin-bottom: 0.8rem;
      color: #f8fafc;
    }

    .options {
      display: grid;
      gap: 0.9rem;
    }

    label {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    label:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.08);
    }

    input[type="radio"] {
      accent-color: var(--accent);
      width: 1.25rem;
      height: 1.25rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 2rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.95rem 1.65rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      background: linear-gradient(135deg, var(--accent), #e85d04);
      box-shadow: 0 18px 30px rgba(244, 140, 6, 0.28);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 38px rgba(244, 140, 6, 0.32);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      box-shadow: none;
    }

    .secondary:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.14);
    }

    .result {
      margin-top: 1.5rem;
      padding: 1.4rem 1.35rem;
      border-radius: 22px;
      background: rgba(16, 35, 82, 0.96);
      border: 1px solid rgba(100, 181, 246, 0.12);
    }

    .result p {
      margin-bottom: 0.8rem;
    }

    .correct {
      color: #7ed957;
    }

    .incorrect {
      color: #ff6b6b;
    }

    .hint {
      margin-top: 0.5rem;
      color: var(--muted);
      line-height: 1.65;
    }

    @media (max-width: 680px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Primary School Math Quiz</h1>
      <p>Practice easy maths for young learners. Answer each question and then check your score with simple explanations.</p>
    </header>

    <section class="quiz-card">
      <div class="question" data-answer="d">
        <h2>1. What is 9 + 7?</h2>
        <div class="options">
          <label><input type="radio" name="q1" value="a" /> 14</label>
          <label><input type="radio" name="q1" value="b" /> 13</label>
          <label><input type="radio" name="q1" value="c" /> 15</label>
          <label><input type="radio" name="q1" value="d" /> 16</label>
        </div>
      </div>

      <div class="question" data-answer="b">
        <h2>2. What is 15 - 6?</h2>
        <div class="options">
          <label><input type="radio" name="q2" value="a" /> 8</label>
          <label><input type="radio" name="q2" value="b" /> 9</label>
          <label><input type="radio" name="q2" value="c" /> 10</label>
          <label><input type="radio" name="q2" value="d" /> 7</label>
        </div>
      </div>

      <div class="question" data-answer="a">
        <h2>3. What is 4 × 3?</h2>
        <div class="options">
          <label><input type="radio" name="q3" value="a" /> 12</label>
          <label><input type="radio" name="q3" value="b" /> 7</label>
          <label><input type="radio" name="q3" value="c" /> 11</label>
          <label><input type="radio" name="q3" value="d" /> 10</label>
        </div>
      </div>

      <div class="question" data-answer="c">
        <h2>4. What is 12 ÷ 4?</h2>
        <div class="options">
          <label><input type="radio" name="q4" value="a" /> 2</label>
          <label><input type="radio" name="q4" value="b" /> 5</label>
          <label><input type="radio" name="q4" value="c" /> 3</label>
          <label><input type="radio" name="q4" value="d" /> 4</label>
        </div>
      </div>

      <div class="question" data-answer="a">
        <h2>5. What is \(\frac{1}{2} + \frac{1}{4}\)?</h2>
        <div class="options">
          <label><input type="radio" name="q5" value="a" /> \(\frac{3}{4}\)</label>
          <label><input type="radio" name="q5" value="b" /> \(\frac{1}{4}\)</label>
          <label><input type="radio" name="q5" value="c" /> \(\frac{2}{3}\)</label>
          <label><input type="radio" name="q5" value="d" /> 1</label>
        </div>
      </div>

      <div class="controls">
        <button id="submit">Submit Answers</button>
        <button id="reset" class="secondary">Reset Quiz</button>
      </div>

      <div id="feedback" class="result" hidden>
        <p id="score"></p>
        <div id="review"></div>
      </div>
    </section>
  </div>

  <script>
    const questions = Array.from(document.querySelectorAll('.question'));
    const submitButton = document.getElementById('submit');
    const resetButton = document.getElementById('reset');
    const feedback = document.getElementById('feedback');
    const scoreText = document.getElementById('score');
    const review = document.getElementById('review');

    const explanations = {
      q1: 'Add 9 and 7 to get 16.',
      q2: 'Subtract 6 from 15 to get 9.',
      q3: 'Multiply 4 by 3 to get 12.',
      q4: 'Divide 12 by 4 to get 3.',
      q5: 'Add the fractions: 1/2 + 1/4 = 3/4.'
    };

    submitButton.addEventListener('click', () => {
      let score = 0;
      review.innerHTML = '';

      questions.forEach((question, index) => {
        const correct = question.dataset.answer;
        const chosen = question.querySelector('input[type="radio"]:checked');
        const answerKey = 'q' + (index + 1);
        const isCorrect = chosen && chosen.value === correct;

        if (isCorrect) {
          score += 1;
        }

        const summary = document.createElement('div');
        summary.innerHTML = `
          <p><strong>Question ${index + 1}:</strong> <span class="${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Correct' : 'Incorrect'}</span></p>
          <p class="hint">${explanations[answerKey]}</p>
        `;
        review.appendChild(summary);
      });

      scoreText.textContent = `You scored ${score} out of ${questions.length}.`;
      feedback.hidden = false;
      feedback.scrollIntoView({ behavior: 'smooth' });
    });

    resetButton.addEventListener('click', () => {
      document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
      feedback.hidden = true;
      review.innerHTML = '';
    });
  </script>
</body>
</html>
